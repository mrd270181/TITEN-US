name: Perbarui data TITEN US

on:
  schedule:
    - cron: "20 22 * * 1-5"   # 05.20 WIB Selasa–Sabtu: harga penutupan bursa AS semalam
    - cron: "20 0 * * 2-6"    # 07.20 WIB  ┐ jadwal cadangan: hanya bekerja kalau
    - cron: "20 3 * * 2-6"    # 10.20 WIB  │ pembaruan sebelumnya gagal / data
    - cron: "20 7 * * 2-6"    # 14.20 WIB  ┘ belum terbaru; selain itu dilewati
    - cron: "0 23 * * 6"      # 06.00 WIB Minggu: daftar emiten + laporan keuangan SEC
    - cron: "0 3 * * 0"       # 10.00 WIB Minggu: cadangan kalau yang 06.00 gagal
  workflow_dispatch:
    inputs:
      mode:
        description: "harian = harga saja, mingguan = + laporan keuangan & daftar emiten"
        type: choice
        options: [harian, mingguan]
        default: harian
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: perbarui-data
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Ambil situs & state terakhir (cabang gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git worktree add lama FETCH_HEAD
          else
            mkdir -p lama
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Jalankan pembaruan
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          MODE="harian"; ULANG=""
          JADWAL="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          case "$JADWAL" in
            "0 23 * * 6") MODE="mingguan" ;;
            "20 0 * * 2-6"|"20 3 * * 2-6"|"20 7 * * 2-6") ULANG="--ulang" ;;
            "0 3 * * 0")
              # cadangan mingguan: ulang hanya kalau jalan mingguan 06.00 tadi belum tercatat
              if python3 -c "import json,sys,datetime as d; m=json.load(open('lama/data/manifest.json')); t=d.datetime.fromisoformat(m['dibuat']); sys.exit(0 if m.get('mode')=='mingguan' and (d.datetime.now(d.timezone.utc)-t).total_seconds() < 8*3600 else 1)" 2>/dev/null; then
                ULANG="--ulang"; else MODE="mingguan"; fi ;;
          esac
          echo "Mode: $MODE $ULANG"
          python pipeline/jalankan.py --mode "$MODE" --lama lama --keluar situs $ULANG

      - name: Terbitkan ke gh-pages
        if: hashFiles('situs/LEWATI') == ''
        run: |
          cd situs
          git init -q -b gh-pages
          git add -A
          git -c user.name="titen-us-bot" -c user.email="titen-us-bot@users.noreply.github.com" \
              commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
